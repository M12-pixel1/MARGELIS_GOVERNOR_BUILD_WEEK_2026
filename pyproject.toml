[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "margelis-governor-build-week-2026"
version = "0.1.0"
description = "Human-gated agent operations with signed evidence and correction-to-eval regression."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=49.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

